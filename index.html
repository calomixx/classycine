<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineClassify Pro | Plataforma de Cine y Series</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Plataforma profesional para clasificar, valorar, guardar y comentar películas y series.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=1.0.3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <!-- SortableJS para Tier List Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- Tailwind CSS Play CDN (v3) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP & ScrollTrigger para animaciones de LandingView -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <!-- Lucide para iconografía outline del shell editorial -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root">
        <div class="splash-screen" id="splash">
        <div class="neon-grid"></div>
        <div class="neon-scanlines">
            <div class="splash-logo">Cine<span>Classify</span></div>
            <div class="splash-loader"><span></span><span></span><span></span></div>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
